name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
    runs-on: ${{ matrix.os }}
    name: "build+test: ${{ matrix.os }} / ${{ matrix.compiler }}"
    steps:
      - uses: actions/checkout@v4

      - name: "Install build tools (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: "Install build tools (macOS)"
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      - name: "Configure"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: "Build"
        run: cmake --build build -j

      - name: "Test"
        run: ctest --test-dir build --output-on-failure

  werror-gate:
    runs-on: ubuntu-latest
    name: "Werror gate"
    steps:
      - uses: actions/checkout@v4

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: "Configure with warnings-as-errors"
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DIMGPIPE_WARNINGS_AS_ERRORS=ON

      - name: "Build (must be warning-clean)"
        run: cmake --build build -j

      - name: "Test"
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    name: "ASan + UBSan"
    steps:
      - uses: actions/checkout@v4

      - name: "Install build tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: "Configure with sanitizers"
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DIMGPIPE_ENABLE_SANITIZERS=ON

      - name: "Build"
        run: cmake --build build-san -j

      - name: "Test under ASan+UBSan"
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
